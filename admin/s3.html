<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>S3</title>
  <link rel="stylesheet" href="./vendor/quasar-umd.css?v=3.5.41-2.26.0-2">
  <link rel="stylesheet" href="./app-page.css?v=16">
  <link rel="stylesheet" href="./browser.css?v=1">
  <link rel="stylesheet" href="./s3.css?v=1">
</head>
<body>
  <div id="q-app">
    <main class="workspace-page az-browser">
      <!-- 未配置：GET /s3 返回 enabled:false（或任何请求 423）时显示说明卡片。 -->
      <div v-if="info && !info.enabled" class="s3-not-configured">
        <q-icon name="mdi-bucket-outline" size="54px"></q-icon>
        <div class="text-h6">{{ t.notConfiguredTitle }}</div>
        <p>{{ t.notConfigured }}</p>
      </div>

      <!-- 已配置：复用共享浏览器组件 + S3 adapter；桶选择器放工具栏插槽。 -->
      <az-browser v-else-if="info && bucket" ref="browser" :adapter="adapter">
        <template v-slot:crumbs="{ crumbs }">
          <q-btn v-for="crumb in crumbs" :key="crumb.path" flat dense no-caps :icon="crumb.root ? 'mdi-bucket-outline' : ''" :label="crumb.label" :class="{ 'crumb-current': crumb.current }" @click="crumb.go"></q-btn>
        </template>
        <template v-slot:toolbar-extra>
          <q-select v-model="bucket" dense outlined :options="buckets" :label="t.selectBucket"
            class="s3-bucket-select" :disabled="buckets.length < 2"></q-select>
        </template>
      </az-browser>

      <div v-if="infoLoading" class="files-loading"><q-linear-progress indeterminate></q-linear-progress></div>
    </main>
  </div>

  <script src="./vendor/quasar-umd.js?v=3.5.41-2.26.0-2"></script>
  <script src="./i18n.js?v=46"></script>
  <script src="./api.js?v=21"></script>
  <script src="./browser.js?v=2"></script>
  <script>
    const { computed, onMounted, ref, watch } = Vue

    const csrfRef = { value: '' }
    window.adminApi.session().then(session => { csrfRef.value = session.csrf || '' }).catch(() => {})

    // 当前桶 / 当前目录用闭包变量供 adapter 的 itemUrl/itemPath/shareUrl 使用；
    // list 成功后才渲染行，切换桶/目录时先置空，时序上一定已更新。
    let currentPath = ''

    const info = ref(null)
    const infoLoading = ref(true)
    const bucket = ref('')
    const browser = ref(null)
    const localeRef = ref(window.adminI18n.getLocale())
    const t = computed(() => window.adminI18n.messages[localeRef.value].s3)

    const buckets = computed(() => (info.value && info.value.buckets || []).map(b => b.name))

    const adapter = {
      storagePrefix: 'authz-s3',
      i18nRoot: 's3',
      supportsMkdir: true, // 后端实现了目录标记对象（以 / 结尾的 0 字节对象）
      rootLabel: () => bucket.value || '', // 面包屑起点 = 当前桶名
      list (path, token) {
        // token 是上一页返回的 next_token（组件 loadMore 传入）；首轮为空。
        return window.adminApi.s3List(bucket.value, path, token).then(data => {
          currentPath = path
          return data
        })
      },
      upload (path, files, overwrite) {
        return window.adminApi.uploadS3(bucket.value, path, files, overwrite)
      },
      mkdir (path, name) {
        return window.adminApi.mkdirS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name })
      },
      rename (path, name, new_name) {
        return window.adminApi.renameS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, new_name })
      },
      remove (path, name, recursive) {
        return window.adminApi.removeS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, recursive })
      },
      itemUrl (item, opts = {}) {
        // 对象字节走 /_authz/s3/<bucket>/<key>，key = 当前目录 + 文件名。
        const key = currentPath === '' ? item.name : currentPath + '/' + item.name
        let url = '/_authz/s3/' + (bucket.value + '/' + key).split('/').map(s => encodeURIComponent(s)).join('/')
        if (opts.preview) url += '?authz_preview=1'
        else if (opts.download) url += '?download=1'
        return url
      },
      itemPath (item) {
        // 复制路径用完整对象 key（含目录前缀，不含桶名）。
        return currentPath === '' ? item.name : currentPath + '/' + item.name
      },
      shareUrl (item) {
        // 分享链接：调 share 接口拿 presigned URL（组件内会复制到剪贴板）。
        return window.adminApi.shareS3(bucket.value, currentPath, item.name)
      }
    }

    function applyLocale (next) {
      localeRef.value = next
      document.documentElement.lang = next
      document.title = t.value.title
      Quasar.Lang.set(next === 'zh-CN' ? Quasar.Lang.zhCN : Quasar.Lang.enUS)
    }
    let unsubscribeLocale

    async function loadInfo () {
      infoLoading.value = true
      try {
        const data = await window.adminApi.s3Info()
        info.value = data
        const saved = localStorage.getItem('authz_s3_bucket') || ''
        const list = (data.buckets || []).map(b => b.name)
        // 记住的上次桶仍在列表里就用它，否则回落到第一个桶。
        bucket.value = list.includes(saved) ? saved : (list[0] || '')
      } catch (err) {
        // 带 bucket 未配置会 423，无 bucket 未配置是 enabled:false；两种都落到未配置卡片。
        info.value = { enabled: false, buckets: [] }
      } finally {
        infoLoading.value = false
      }
    }

    // 生命周期必须写在 setup 内（组件实例的 setup 上下文里）才会被 Vue 注册；
    // 写在外层模块作用域时 watch/onMounted 是空跑，页面会一直停在 loading。
    const app = Vue.createApp({
      setup () {
        // 切换桶：记住选择，并让组件回到桶根目录重新加载（清空旧条目避免 404 串图）。
        watch(bucket, next => {
          if (!next) return
          localStorage.setItem('authz_s3_bucket', next)
          if (browser.value) browser.value.navigate('')
        })

        onMounted(() => {
          applyLocale(localeRef.value)
          unsubscribeLocale = window.adminI18n.subscribe(applyLocale)
          loadInfo()
        })

        return { adapter, browser, bucket, buckets, info, infoLoading, t }
      }
    })
    app.component('AzBrowser', window.authzBrowser.component)
    app.use(Quasar, { config: { dark: true } })
    Quasar.Dark.set(true)
    Quasar.Lang.set(window.adminI18n.getLocale() === 'en-US' ? Quasar.Lang.enUS : Quasar.Lang.zhCN)
    Quasar.IconSet.set(Quasar.IconSet.mdiV7)
    app.mount('#q-app')
  </script>
</body>
</html>
