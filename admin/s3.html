<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>S3</title>
  <link rel="stylesheet" href="./vendor/quasar-umd.css?v=3.5.41-2.26.0-2">
  <link rel="stylesheet" href="./app-page.css?v=16">
  <link rel="stylesheet" href="./browser.css?v=5">
  <link rel="stylesheet" href="./s3.css?v=3">
  <link rel="stylesheet" href="./s3-configs.css?v=2">
</head>
<body>
  <div id="q-app">
    <main class="workspace-page az-browser">
      <!-- 配置视图：原「存储配置」独立页（s3-configs.html）内联进来，
           由迁移 v27 隐藏其菜单入口；返回按钮回到浏览器视图。 -->
      <az-s3-configs v-if="view === 'configs'" show-back @back="setView('browser')"></az-s3-configs>

      <!-- 未配置：GET /s3 返回 enabled:false（或任何请求 423）时显示说明卡片。
           「配置」按钮在卡片外也渲染（见 header），未配置时可直接进配置视图。 -->
      <div v-if="view === 'browser' && info && !info.enabled" class="s3-not-configured">
        <q-icon name="mdi-bucket-outline" size="54px"></q-icon>
        <div class="text-h6">{{ t.notConfiguredTitle }}</div>
        <p>{{ t.notConfigured }}</p>
      </div>

      <div v-if="view === 'browser' && info && !info.enabled" class="s3-not-configured-actions">
        <q-btn v-if="isAdmin" unelevated no-caps icon="mdi-cog-outline" color="primary"
               :label="t.configButton" @click="setView('configs')"></q-btn>
      </div>

      <!-- 已配置：复用共享浏览器组件 + S3 adapter；桶选择器放工具栏插槽。 -->
      <az-browser v-else-if="view === 'browser' && info && bucket" ref="browser" :adapter="adapter">
        <template v-slot:crumbs="{ crumbs }">
          <q-btn v-for="crumb in crumbs" :key="crumb.path" flat dense no-caps :icon="crumb.root ? 'mdi-bucket-outline' : ''" :label="crumb.label" :class="{ 'crumb-current': crumb.current }" @click="crumb.go"></q-btn>
        </template>
        <template v-slot:toolbar-extra>
          <q-btn v-if="isAdmin" dense flat no-caps icon="mdi-cog-outline" :label="t.configButton"
                 :title="t.configTooltip" @click="setView('configs')"></q-btn>
          <div v-if="writableScope.length" class="s3-writable-scope">{{ t.writableScope }}{{ writableScope.join(', ') }}</div>
          <!-- cfg 是字符串（id/name），必须 emit-value map-options 才会按 value 匹配、按 label 显示。 -->
          <q-select v-model="cfg" dense outlined :options="cfgOptions" :label="t.selectCfg"
            emit-value map-options class="s3-cfg-select"></q-select>
          <q-select v-model="bucket" dense outlined :options="buckets" :label="t.selectBucket"
            class="s3-bucket-select" :disabled="buckets.length < 2"></q-select>
        </template>
      </az-browser>

      <div v-if="view === 'browser' && infoLoading" class="files-loading"><q-linear-progress indeterminate></q-linear-progress></div>
    </main>
  </div>

  <script src="./vendor/quasar-umd.js?v=3.5.41-2.26.0-2"></script>
  <script src="./i18n.js?v=60"></script>
  <script src="./api.js?v=24"></script>
  <script src="./browser.js?v=17"></script>
  <script src="./s3-configs.js?v=1"></script>
  <script>
    const { computed, onBeforeUnmount, onMounted, ref, watch } = Vue

    const csrfRef = { value: '' }
    // admin 判定沿用既有写法：session.admin（admin API Key 直连时也为 true），
    // 控制「配置」按钮可见性；API Key 场景没有 CSRF，配置视图内的写操作
    // 依赖 session() 已带回的 csrf（缺失时后端按无 CSRF 拒绝并透出错误文案）。
    const isAdmin = ref(false)
    window.adminApi.session().then(session => {
      csrfRef.value = session.csrf || ''
      isAdmin.value = Boolean(session.admin)
    }).catch(() => {})

    // 页面视图：'browser' = 对象浏览（默认），'configs' = 存储服务配置。
    // 锚点 #configs 直接进入配置视图（薄壳页/历史链接依赖）；setView 同步锚点，
    // 使外层 index.html 的 hash 恢复逻辑也能带回配置视图。
    const VIEW_KEY = 'configs'
    const view = ref(String(window.location.hash || '').replace(/^#/, '') === VIEW_KEY ? 'configs' : 'browser')
    function setView (next) {
      // 从配置视图返回时，若浏览器视图还停在未配置状态（刚在配置里新建了服务），
      // 重拉一次 info，避免用户以为保存没生效。先置空 info 再刷新：旧响应里
      // buckets 为空，若先挂载组件，watch(bucket) 不会导航，会白跑一轮 list。
      if (next === 'browser' && view.value === 'configs' && info.value && !info.value.enabled) {
        info.value = null
        view.value = next
        loadInfo()
        return
      }
      view.value = next
      const target = window.location.pathname + '#' + (next === 'configs' ? VIEW_KEY : '')
      window.history.replaceState(null, '', target)
    }
    function onHashChange () {
      const hash = String(window.location.hash || '').replace(/^#/, '')
      view.value = hash === VIEW_KEY ? 'configs' : 'browser'
    }

    // 当前桶 / 当前目录用闭包变量供 adapter 的 itemUrl/itemPath 使用；
    // list 成功后才渲染行，切换桶/目录时先置空，时序上一定已更新。
    let currentPath = ''

    // 当前存储服务（cfg id 或 name）：初值取 localStorage 的 authz_s3_cfg，
    // 缺失/失效时由 loadInfo 回落到后端返回的默认配置。
    const CFG_KEY = 'authz_s3_cfg'

    const info = ref(null)
    const infoLoading = ref(true)
    const bucket = ref('')
    const cfg = ref(localStorage.getItem(CFG_KEY) || '')
    const configs = ref([])
    const browser = ref(null)
    const localeRef = ref(window.adminI18n.getLocale())
    const t = computed(() => window.adminI18n.messages[localeRef.value].s3)

    const buckets = computed(() => (info.value && info.value.buckets || []).map(b => b.name))

    // 可选服务列表：优先用 GET /api/s3 新增的 configs 字段，缺失时另拉
    // GET /api/s3-configs（同一份数据，两个入口都可用才不至于选不了服务）。
    const cfgOptions = computed(() => configs.value.map(row => ({
      value: cfgIdent(row),
      label: row.name + (isOn(row.is_default) ? ' · ' + t.value.cfgDefaultSuffix : '')
    })))

    function cfgIdent (row) {
      // 后端 id 优先（数字/字符串都按原样传），无名可回落的极端情况用 name。
      return row.id !== undefined && row.id !== null && row.id !== '' ? String(row.id) : String(row.name || '')
    }

    // 布尔位统一判定：库里的整数 1/0 与 JSON 的 true/false 都要认。
    function isOn (value) {
      return value === 1 || value === true || value === '1'
    }

    // 可写范围提示：仅当“部分可写”（writable_all=false 且 writable_roots 非空）时显示。
    const writableScope = computed(() => {
      const d = info.value
      if (!d || d.writable_all || !Array.isArray(d.writable_roots) || !d.writable_roots.length) return []
      return d.writable_roots
    })

    const adapter = {
      storagePrefix: 'authz-s3',
      i18nRoot: 's3',
      supportsMkdir: true, // 后端实现了目录标记对象（以 / 结尾的 0 字节对象）
      supportsWritable: true, // 后端按 AUTHZ_S3_WRITABLE_PATHS 返回 data.writable / items[].writable
      rootLabel: () => bucket.value || '', // 面包屑起点 = 当前桶名
      list (path, token) {
        // token 是上一页返回的 next_token（组件 loadMore 传入）；首轮为空。
        return window.adminApi.s3List(bucket.value, path, token, cfg.value).then(data => {
          currentPath = path
          return data
        })
      },
      upload (path, files, overwrite) {
        // 写操作统一带 auto-mkdir：目标在默认 share 条目内而挂载祖先
        // 目录标记尚缺时，后端先补建祖先再执行；范围外仍 403，不会越权。
        return window.adminApi.uploadS3(bucket.value, path, files, overwrite, { mkdir: true, cfg: cfg.value })
      },
      mkdir (path, name) {
        return window.adminApi.mkdirS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, mkdir: 1, cfg: cfg.value })
      },
      rename (path, name, new_name) {
        return window.adminApi.renameS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, new_name, cfg: cfg.value })
      },
      remove (path, name, recursive) {
        return window.adminApi.removeS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, recursive, cfg: cfg.value })
      },
      // 跨前缀移动复用 rename 端点的 new_path（new_name 传原名 = 纯移动）；
      // 源与目标两个 key 都要落在 AUTHZ_S3_WRITABLE_PATHS 内，由服务端判定。
      move (path, name, newPath) {
        return window.adminApi.renameS3({ _csrf: csrfRef.value, bucket: bucket.value, path, name, new_name: name, new_path: newPath, cfg: cfg.value })
      },
      itemUrl (item, opts = {}) {
        // 对象字节走 /_authz/s3/<bucket>/<key>，key = 当前目录 + 文件名。
        const key = currentPath === '' ? item.name : currentPath + '/' + item.name
        let url = '/_authz/s3/' + (bucket.value + '/' + key).split('/').map(s => encodeURIComponent(s)).join('/')
        const query = []
        if (opts.preview) query.push('authz_preview=1')
        else if (opts.download) query.push('download=1')
        // 当前生效配置始终显式带上：默认服务与非默认服务走同一条代码路径
        // （cfg 为空只可能出现在首轮响应之前的瞬间，那时还没有条目可拼 URL）。
        if (cfg.value) query.push('cfg=' + encodeURIComponent(cfg.value))
        // query 为空时不拼裸 '?'：保持与旧版 URL 逐字节一致。
        return query.length ? url + '?' + query.join('&') : url
      },
      itemPath (item) {
        // 复制路径用完整对象 key（含目录前缀，不含桶名）。
        return currentPath === '' ? item.name : currentPath + '/' + item.name
      },
    }

    let recoveringCfg = false
    // applyCfg 里对齐后端摘要时抑制一次 watch(cfg)：此时正在同一次 loadInfo 里，
    // 再重载一次会白跑一轮请求。
    let applyingCfg = false

    // 后端回带的生效配置摘要（{id,name,...} 或 id/name）：记忆值失效时对齐它。
    function applyCfg (active) {
      if (!active) return
      const ident = typeof active === 'object' ? cfgIdent(active) : String(active)
      if (!ident) return
      if (cfg.value !== ident) {
        applyingCfg = true
        cfg.value = ident
        localStorage.setItem(CFG_KEY, ident)
      }
      recoveringCfg = false
    }

    function applyLocale (next) {
      localeRef.value = next
      document.documentElement.lang = next
      document.title = t.value.title
      Quasar.Lang.set(next === 'zh-CN' ? Quasar.Lang.zhCN : Quasar.Lang.enUS)
    }
    let unsubscribeLocale

    async function loadInfo () {
      infoLoading.value = true
      let retryWithDefault = false
      try {
        const data = await window.adminApi.s3Info(undefined, cfg.value)
        info.value = data
        configs.value = data.configs || []
        if (!configs.value.length) {
          // 后端未回带 configs（旧版本）时另拉一次配置列表，保证下拉可用。
          try {
            const extra = await window.adminApi.s3Configs()
            configs.value = extra.items || []
          } catch (cfgError) {
            configs.value = []
          }
        }
        applyCfg(data.cfg)
        const saved = localStorage.getItem('authz_s3_bucket') || ''
        const list = (data.buckets || []).map(b => b.name)
        // 记住的上次桶仍在列表里就用它，否则回落到第一个桶。
        bucket.value = list.includes(saved) ? saved : (list[0] || '')
        // share 挂载默认值预置：默认可写根 = share/<本机LAN IP>（info.share_prefix）。
        // 当前桶命中 share 条目（share_bucket 空=任意桶；非空须等于当前桶）且
        // 用户还没有浏览路径记录（组件初始路径取自 localStorage 的
        // <storagePrefix>_path，即 authz-s3_path）时，把初始路径预置为
        // share_prefix，az-browser 挂载（info 就位后才创建）后直接落在默认
        // 可写目录而不是只读桶根。share_bucket 为空时 share_prefix 就是纯
        // 路径前缀；非空且等于当前桶时同样直接使用（前缀不含桶名）。
        const sharePrefix = typeof data.share_prefix === 'string' ? data.share_prefix : ''
        const shareBucket = typeof data.share_bucket === 'string' ? data.share_bucket : ''
        if (sharePrefix && bucket.value && (!shareBucket || shareBucket === bucket.value)
            && !localStorage.getItem('authz-s3_path')) {
          localStorage.setItem('authz-s3_path', sharePrefix)
        }
      } catch (err) {
        // 带 bucket 未配置会 423，无 bucket 未配置是 enabled:false；两种都落到未配置卡片。
        info.value = { enabled: false, buckets: [] }
        // 记住的 cfg 指向已删除/已停用的服务时，回落默认配置再重载一次，
        // 否则页面会停在「该服务不存在」的未配置卡片上出不来。
        if (cfg.value && !recoveringCfg) {
          recoveringCfg = true
          retryWithDefault = true
          cfg.value = ''
          localStorage.removeItem(CFG_KEY)
        }
      } finally {
        infoLoading.value = false
      }
      // 重试放在 finally 之后：让本次的 loading 位先落回，再发起回落请求。
      if (retryWithDefault) return loadInfo()
    }

    // 生命周期必须写在 setup 内（组件实例的 setup 上下文里）才会被 Vue 注册；
    // 写在外层模块作用域时 watch/onMounted 是空跑，页面会一直停在 loading。
    const app = Vue.createApp({
      setup () {
        // 切换桶：记住选择，并让组件回到桶根目录重新加载（清空旧条目避免 404 串图）。
        watch(bucket, next => {
          if (!next) return
          localStorage.setItem('authz_s3_bucket', next)
          if (browser.value) browser.value.navigate('')
        })

        // 切换存储服务：记住选择 → 抹掉旧服务的浏览路径 → 清空桶（组件随之
        // 卸载，不会再用旧桶/旧路径发请求）→ 重新拉取该服务的桶列表。
        // 路径必须一起清掉：组件的初始路径取自 localStorage 的 authz-s3_path，
        // 该键不区分服务，留着旧路径会在只含另一套前缀的服务上撞 404。清掉后
        // loadInfo 会按新服务的 share_prefix 重新预置（没有就落在桶根）。
        // 组件重挂载后由 watch(bucket) 负责导航，这里不抢先 navigate('')。
        watch(cfg, next => {
          if (!next) return
          if (applyingCfg) {
            applyingCfg = false
            return
          }
          localStorage.setItem(CFG_KEY, next)
          localStorage.removeItem('authz-s3_path')
          bucket.value = ''
          loadInfo()
        })

        onMounted(() => {
          applyLocale(localeRef.value)
          unsubscribeLocale = window.adminI18n.subscribe(applyLocale)
          window.addEventListener('hashchange', onHashChange)
          loadInfo()
        })
        onBeforeUnmount(() => window.removeEventListener('hashchange', onHashChange))

        return { adapter, browser, bucket, buckets, cfg, cfgOptions, configs, info, infoLoading, isAdmin, setView, t, view, writableScope }
      }
    })
    app.component('AzBrowser', window.authzBrowser.component)
    app.component('AzS3Configs', window.authzS3Configs.component)
    app.use(Quasar, { config: { dark: true } })
    Quasar.Dark.set(true)
    Quasar.Lang.set(window.adminI18n.getLocale() === 'en-US' ? Quasar.Lang.enUS : Quasar.Lang.zhCN)
    Quasar.IconSet.set(Quasar.IconSet.mdiV7)
    app.mount('#q-app')
  </script>
</body>
</html>
