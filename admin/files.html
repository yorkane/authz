<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Files</title>
  <link rel="stylesheet" href="./vendor/quasar-umd.css?v=3.5.41-2.26.0-2">
  <link rel="stylesheet" href="./app-page.css?v=16">
  <link rel="stylesheet" href="./files.css?v=10">
  <link rel="stylesheet" href="./browser.css?v=2">
</head>
<body>
  <div id="q-app">
    <!-- 交互逻辑（网格/列表视图、键盘导航、预览、上传、重命名删除）全部在
         browser.js 的共享组件里；本文件只剩页面外壳 + files 端点 adapter。 -->
    <main class="workspace-page az-browser az-authz-files">
      <az-browser :adapter="adapter">
        <template v-slot:crumbs="{ crumbs }">
          <q-btn v-for="crumb in crumbs" :key="crumb.path" flat dense no-caps :icon="crumb.root ? 'mdi-home-outline' : ''" :label="crumb.label" :class="{ 'crumb-current': crumb.current }" @click="crumb.go"></q-btn>
        </template>
      </az-browser>
    </main>
  </div>

  <script src="./vendor/quasar-umd.js?v=3.5.41-2.26.0-2"></script>
  <script src="./i18n.js?v=47"></script>
  <script src="./api.js?v=22"></script>
  <script src="./browser.js?v=4"></script>
  <script>
    // files 端点 adapter：接口路径与字段与旧版完全一致（/_authz/files*），
    // 只是把「当前目录/内容根」放进闭包变量，供 itemUrl/itemPath 使用。
    const csrfRef = { value: '' }
    window.adminApi.session().then(session => { csrfRef.value = session.csrf || '' }).catch(() => {})

    let rootPath = ''     // 内容根的服务器绝对路径（list 接口对 admin 返回），复制路径用
    let currentPath = ''  // 当前浏览目录；list 成功后才渲染行，时序上一定已更新

    const adapter = {
      storagePrefix: 'authz-files', // localStorage 命名空间（旧键 files_* 作废）
      i18nRoot: 'files',
      supportsMkdir: true,
      rootLabel: '', // 空串 → 组件回退到 browser 文案「根目录」
      list (path) {
        return window.adminApi.files(path).then(data => {
          rootPath = data.root || ''
          currentPath = path
          return data
        })
      },
      upload (path, files, overwrite) {
        return window.adminApi.uploadFiles(path, files, overwrite)
      },
      mkdir (path, name) {
        return window.adminApi.mkdirFile({ _csrf: csrfRef.value, path, name })
      },
      rename (path, name, new_name) {
        return window.adminApi.renameFile({ _csrf: csrfRef.value, path, name, new_name })
      },
      remove (path, name, recursive) {
        return window.adminApi.removeFile({ _csrf: csrfRef.value, path, name, recursive })
      },
      itemUrl (item, opts = {}) {
        // preview 位带 ?authz_preview=1：nginx 对该请求注入 ESC 转发脚本
        // （沙箱 iframe 的按键不会冒泡到本页面，见 nginx.conf 的注入 map）。
        const segments = (currentPath === '' ? item.name : currentPath + '/' + item.name).split('/')
        let url = '/_authz/files/' + segments.map(s => encodeURIComponent(s)).join('/')
        if (opts.preview) url += '?authz_preview=1'
        else if (opts.download) url += '?download=1'
        return url
      },
      itemPath (item) {
        // 复制服务端绝对路径：内容根 + 当前目录 + 文件名（容器视角完整路径）。
        const root = (rootPath || '/files').replace(/\/+$/, '')
        const sub = currentPath === '' ? item.name : currentPath + '/' + item.name
        return root + '/' + sub
      }
    }

    const app = Vue.createApp({ setup: () => ({ adapter }) })
    app.component('AzBrowser', window.authzBrowser.component)
    app.use(Quasar, { config: { dark: true } })
    Quasar.Dark.set(true)
    Quasar.Lang.set(window.adminI18n.getLocale() === 'en-US' ? Quasar.Lang.enUS : Quasar.Lang.zhCN)
    Quasar.IconSet.set(Quasar.IconSet.mdiV7)
    app.mount('#q-app')
  </script>
</body>
</html>
