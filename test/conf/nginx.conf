user root;
worker_processes 1;
error_log /repo/test/logs/error.log warn;
pid       /repo/test/logs/nginx.pid;

events { worker_connections 64; }

http {
    lua_package_path  "/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

    server {
        listen 8080;
        server_name localhost;

        # ── 1. Lua 基础 ───────────────────────────────────────────────
        location /hello {
            default_type text/plain;
            content_by_lua_block {
                ngx.say("hello from lua")
                ngx.say("ngx_lua_version=" .. ngx.config.ngx_lua_version)
                ngx.say("openresty_version=" .. ngx.config.nginx_version)
            }
        }

        # ── 2. cjson（内置库）────────────────────────────────────────
        location /json {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson"
                ngx.say(cjson.encode({
                    status  = "ok",
                    module  = "cjson",
                    ts      = ngx.time(),
                }))
            }
        }

        # ── 3. resty.core / ngx.re / resty.lrucache ──────────────────
        location /core {
            default_type text/plain;
            content_by_lua_block {
                local libs = {
                    "resty.core",
                    "ngx.re",
                    "resty.lrucache",
                    "resty.string",
                    "resty.md5",
                }
                for _, name in ipairs(libs) do
                    local ok, err = pcall(require, name)
                    ngx.say(name .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(err))))
                end
            }
        }

        # ── 4. LuaJIT FFI smoke test ──────────────────────────────────
        location /ffi {
            default_type text/plain;
            content_by_lua_block {
                local ffi = require "ffi"
                ffi.cdef[[ int printf(const char *fmt, ...); ]]
                ngx.say("ffi: OK")
                ngx.say("arch: " .. ffi.arch)
                ngx.say("os: "   .. ffi.os)
            }
        }

        # ── 5. FancyIndex 目录浏览 ────────────────────────────────────
        location /files/ {
            alias          /repo/test/html/;
            fancyindex     on;
            fancyindex_exact_size off;
            fancyindex_time_format "%Y-%m-%d %H:%M";
        }

        # ── 6. WebDAV (dav + dav-ext-module) ─────────────────────────
        location /dav/ {
            alias   /repo/test/dav/;
            dav_methods        PUT DELETE MKCOL COPY MOVE;
            dav_ext_methods    PROPFIND OPTIONS LOCK UNLOCK;
            dav_access         user:rw group:rw all:r;
            create_full_put_path on;
            autoindex          on;
        }

        # ── 8. JWT 公共库 ────────────────────────────────────────────
        location /jwt {
            default_type text/plain;
            content_by_lua_block {
                local mods = { "resty.jwt", "resty.jwt-validators", "resty.hmac" }
                for _, m in ipairs(mods) do
                    local ok, err = pcall(require, m)
                    ngx.say(m .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(err))))
                end

                local jwt = require "resty.jwt"
                local secret = "jwt-test-secret"
                local exp = ngx.time() + 3600
                local token = jwt:sign(secret, {
                    header = { typ = "JWT", alg = "HS256" },
                    payload = { uid = 3, uname = "kate", exp = exp },
                })
                local verified = token and jwt:verify(secret, token)
                ngx.say("sign/verify: " ..
                    (verified and verified.verified and verified.payload.uid == 3 and "OK" or "FAIL"))

                local rejected = token and jwt:verify("wrong-secret", token)
                ngx.say("bad secret: " ..
                    (rejected and rejected.verified and "accepted!" or "rejected"))
            }
        }
    }
}
