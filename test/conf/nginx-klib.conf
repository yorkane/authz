worker_processes 1;
error_log stderr notice;
pid /tmp/klib-nginx.pid;

events { worker_connections 64; }

http {
    lua_package_path "/repo/test/fixtures/?.lua;/repo/lualib/?.lua;/repo/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_shared_dict klib_test 1m;

    server {
        listen 8081;
        server_name localhost;

        location = /klib/load {
            default_type text/plain;
            content_by_lua_block {
                local modules = {"klib.sbuffer", "klib.ctxvar", "klib.klass", "klib.dump", "klib.router"}
                for _, name in ipairs(modules) do
                    local ok, result = pcall(require, name)
                    ngx.say(name .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(result))))
                end
            }
        }

        location = /klib/sbuffer {
            default_type text/plain;
            content_by_lua_block {
                local sbuffer = require "klib.sbuffer"
                local sb = sbuffer("a", 1, {"b", "c"})
                sb:add("d", 2):pop(1)
                ngx.say(tostring(sb))
            }
        }

        location = /klib/ctxvar {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local ctxvar = require "klib.ctxvar"
                local ctx = ctxvar.new()
                ngx.say(cjson.encode({
                    uri = ctx.uri,
                    method = ctx.method,
                    host = ctx.host,
                    host_1 = ctx.host_1,
                    host_2 = ctx.host_2,
                    normalized = ctxvar.normalize_url("http://example.test//a///b"),
                    domain_1 = ctxvar.get_domain("l3.l2.test.com", 1),
                    formatted = ctxvar.format_var("$host:$request_method", ctx),
                }))
            }
        }

        # One APP location matching tracker.router's /tracker root_entry.
        location ^~ /tracker {
            content_by_lua_block {
                require("tracker.router"):handle()
            }
        }

        # Negative probe: location prefix does not match tracker.router root_entry.
        location ^~ /_api_/ {
            content_by_lua_block {
                require("tracker.router"):handle()
            }
        }

        location = /klib/ctxvar-test {
            default_type text/plain;
            content_by_lua_block {
                local ctxvar = require "klib.ctxvar"
                local ok, err = pcall(ctxvar.test)
                ngx.say(ok and "ctxvar.test: OK" or ("ctxvar.test: FAIL - " .. tostring(err)))
            }
        }

        # Destructive regression probe: call only after all normal ctxvar tests.
        location = /klib/timer-unseeded {
            default_type text/plain;
            content_by_lua_block {
                local ctxvar = require "klib.ctxvar"
                local env = ctxvar.new({}, true)
                ngx.say("is_timer=" .. tostring(env.is_timer))
            }
        }

        location = /klib/klass {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local klass = require "klib.klass"
                local obj = {value = 1, run = function(self, arg) return arg end}
                local info = klass.parse_func(obj.run)
                ngx.say(cjson.encode({name = info.name, param = info.param, what = info.what}))
            }
        }

        location = /klib/dump {
            default_type text/plain;
            content_by_lua_block {
                local dump = require "klib.dump"
                ngx.say(tostring(dump.dump_lua({b = 2, a = 1, nested = {ok = true}})))
            }
        }
    }
}
