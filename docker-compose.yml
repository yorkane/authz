# openresty-base Authz Gateway
#
# 功能: 动态端口反向代理 + 本地认证授权 (SQLite + mini-casbin)
#   - http  入口 AUTHZ_HTTP_PORT(默认6080)  → HTTP 上游
#   - https 入口 AUTHZ_HTTPS_PORT(默认6443) → 网关终止 TLS 后代理 HTTP 上游
#   - 数字前缀子域名免配置: 3000-任意域名 → 本机3000端口 (范围 AUTHZ_PORT_MIN~MAX)
#   - 管理界面: http://<host>:6080/_authz/apps/  (首次启动 admin/admin123, 登录后改密)
#
# 使用:
#   cp .env.example .env && vim .env      # 至少修改 AUTHZ_ADMIN_PASSWORD
#   docker compose up -d
#   docker compose logs -f
#
# 注意: 使用 host 网络，让网关可以直接访问宿主机 127.0.0.1 上的服务
#       conf/ 以只读方式挂载，模板变化重启容器即可，无需重新构建镜像

services:
  gateway:
    build:
      context: .
      args:
        RESTY_J: ${RESTY_J:-8}
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
    image: ghcr.io/yorkane/authz:latest
    container_name: openresty-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      AUTHZ_ADMIN_PASSWORD: ${AUTHZ_ADMIN_PASSWORD:-admin123}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-4}
      AUTHZ_HTTP_PORT: ${AUTHZ_HTTP_PORT:-6080}
      AUTHZ_HTTPS_PORT: ${AUTHZ_HTTPS_PORT:-6443}
      # 生产默认把 HTTP 308 到 HTTPS；disabled 仅绑定回环；serve 仅供受控测试。
      AUTHZ_HTTP_MODE: ${AUTHZ_HTTP_MODE:-redirect}
      AUTHZ_PORT_MIN: ${AUTHZ_PORT_MIN:-2000}
      AUTHZ_PORT_MAX: ${AUTHZ_PORT_MAX:-20000}
      AUTHZ_DISCOVERY_PORTS: ${AUTHZ_DISCOVERY_PORTS:-}
      AUTHZ_DISCOVERY_TTL: ${AUTHZ_DISCOVERY_TTL:-30}
      AUTHZ_DISCOVERY_CONNECT_TIMEOUT_MS: ${AUTHZ_DISCOVERY_CONNECT_TIMEOUT_MS:-100}
      AUTHZ_DISCOVERY_READ_TIMEOUT_MS: ${AUTHZ_DISCOVERY_READ_TIMEOUT_MS:-200}
      AUTHZ_DB_CACHE_TTL: ${AUTHZ_DB_CACHE_TTL:-30}
      AUTHZ_DB_CACHE_LRU_SIZE: ${AUTHZ_DB_CACHE_LRU_SIZE:-500}
      AUTHZ_DB_PATH: ${AUTHZ_DB_PATH:-/data/authz/authz.db}
      AUTHZ_CERT_DIR: ${AUTHZ_CERT_DIR:-/data/certs}
      AUTHZ_SESSION_TTL: ${AUTHZ_SESSION_TTL:-604800}
      # 共享会话 (Redis): 多实例间共享登录身份; 策略与绑定仍由各实例本地管理
      AUTHZ_SESSION_SHARED: ${AUTHZ_SESSION_SHARED:-false}
      AUTHZ_SESSION_REDIS_URL: ${AUTHZ_SESSION_REDIS_URL:-}
      AUTHZ_SESSION_REDIS_MODE: ${AUTHZ_SESSION_REDIS_MODE:-read-only}
      AUTHZ_SESSION_REDIS_USERNAME: ${AUTHZ_SESSION_REDIS_USERNAME:-}
      AUTHZ_SESSION_REDIS_PASSWORD: ${AUTHZ_SESSION_REDIS_PASSWORD:-}
      AUTHZ_SESSION_REDIS_DB: ${AUTHZ_SESSION_REDIS_DB:-0}
      AUTHZ_SESSION_REDIS_PREFIX: ${AUTHZ_SESSION_REDIS_PREFIX:-authz}
      AUTHZ_COOKIE_SECURE: ${AUTHZ_COOKIE_SECURE:-false}
      AUTHZ_COOKIE_DOMAIN: ${AUTHZ_COOKIE_DOMAIN:-}
      AUTHZ_HOST_URL: ${AUTHZ_HOST_URL:-}
      # 登录防护：失败延迟返回 + 连续失败锁定（窗口=锁定时间）
      AUTHZ_LOGIN_ATTEMPTS: ${AUTHZ_LOGIN_ATTEMPTS:-5}
      AUTHZ_LOGIN_WINDOW: ${AUTHZ_LOGIN_WINDOW:-1800}
      AUTHZ_LOGIN_FAIL_DELAY_MS: ${AUTHZ_LOGIN_FAIL_DELAY_MS:-1000}
      # Agent 专用 API Key（仅本机可用，角色 admin）；留空不创建
      AUTHZ_AGENT_API_KEY: ${AUTHZ_AGENT_API_KEY:-}
      AUTHZ_NOCO_ENABLED: ${AUTHZ_NOCO_ENABLED:-false}
      AUTHZ_NOCO_URL: ${AUTHZ_NOCO_URL:-}
      AUTHZ_NOCO_ROLE_MAP: ${AUTHZ_NOCO_ROLE_MAP:-root=admin,admin=admin,member=user}
      AUTHZ_NOCO_CONNECT_TIMEOUT_MS: ${AUTHZ_NOCO_CONNECT_TIMEOUT_MS:-3000}
      AUTHZ_NOCO_SEND_TIMEOUT_MS: ${AUTHZ_NOCO_SEND_TIMEOUT_MS:-5000}
      AUTHZ_NOCO_READ_TIMEOUT_MS: ${AUTHZ_NOCO_READ_TIMEOUT_MS:-5000}
      AUTHZ_NOCO_OAUTH_ENABLED: ${AUTHZ_NOCO_OAUTH_ENABLED:-false}
      AUTHZ_NOCO_OAUTH_TITLE: ${AUTHZ_NOCO_OAUTH_TITLE:-NocoBase}
      AUTHZ_NOCO_OAUTH_CLIENT_ID: ${AUTHZ_NOCO_OAUTH_CLIENT_ID:-}
      AUTHZ_NOCO_OAUTH_CLIENT_SECRET: ${AUTHZ_NOCO_OAUTH_CLIENT_SECRET:-}
      AUTHZ_NOCO_OAUTH_REDIRECT_URI: ${AUTHZ_NOCO_OAUTH_REDIRECT_URI:-}
      AUTHZ_NOCO_OAUTH_DEFAULT_ROLES: ${AUTHZ_NOCO_OAUTH_DEFAULT_ROLES:-viewer}
      AUTHZ_GOOGLE_ENABLED: ${AUTHZ_GOOGLE_ENABLED:-false}
      AUTHZ_GOOGLE_CLIENT_ID: ${AUTHZ_GOOGLE_CLIENT_ID:-}
      AUTHZ_GOOGLE_CLIENT_SECRET: ${AUTHZ_GOOGLE_CLIENT_SECRET:-}
      AUTHZ_GOOGLE_REDIRECT_URI: ${AUTHZ_GOOGLE_REDIRECT_URI:-}
      AUTHZ_GOOGLE_DEFAULT_ROLES: ${AUTHZ_GOOGLE_DEFAULT_ROLES:-viewer}
      AUTHZ_DINGTALK_ENABLED: ${AUTHZ_DINGTALK_ENABLED:-false}
      AUTHZ_DINGTALK_CLIENT_ID: ${AUTHZ_DINGTALK_CLIENT_ID:-}
      AUTHZ_DINGTALK_CLIENT_SECRET: ${AUTHZ_DINGTALK_CLIENT_SECRET:-}
      AUTHZ_DINGTALK_REDIRECT_URI: ${AUTHZ_DINGTALK_REDIRECT_URI:-}
      AUTHZ_DINGTALK_DEFAULT_ROLES: ${AUTHZ_DINGTALK_DEFAULT_ROLES:-viewer}
      AUTHZ_WECHAT_ENABLED: ${AUTHZ_WECHAT_ENABLED:-false}
      AUTHZ_WECHAT_APP_ID: ${AUTHZ_WECHAT_APP_ID:-}
      AUTHZ_WECHAT_APP_SECRET: ${AUTHZ_WECHAT_APP_SECRET:-}
      AUTHZ_WECHAT_REDIRECT_URI: ${AUTHZ_WECHAT_REDIRECT_URI:-}
      AUTHZ_WECHAT_DEFAULT_ROLES: ${AUTHZ_WECHAT_DEFAULT_ROLES:-viewer}
      AUTHZ_OAUTH_ENABLED: ${AUTHZ_OAUTH_ENABLED:-false}
      AUTHZ_OAUTH_PROVIDER: ${AUTHZ_OAUTH_PROVIDER:-oauth}
      AUTHZ_OAUTH_TITLE: ${AUTHZ_OAUTH_TITLE:-OAuth}
      AUTHZ_OAUTH_CLIENT_ID: ${AUTHZ_OAUTH_CLIENT_ID:-}
      AUTHZ_OAUTH_CLIENT_SECRET: ${AUTHZ_OAUTH_CLIENT_SECRET:-}
      AUTHZ_OAUTH_AUTHORIZE_URL: ${AUTHZ_OAUTH_AUTHORIZE_URL:-}
      AUTHZ_OAUTH_TOKEN_URL: ${AUTHZ_OAUTH_TOKEN_URL:-}
      AUTHZ_OAUTH_USERINFO_URL: ${AUTHZ_OAUTH_USERINFO_URL:-}
      AUTHZ_OAUTH_REDIRECT_URI: ${AUTHZ_OAUTH_REDIRECT_URI:-}
      AUTHZ_OAUTH_SCOPE: ${AUTHZ_OAUTH_SCOPE:-openid email profile}
      AUTHZ_OAUTH_SUBJECT_CLAIM: ${AUTHZ_OAUTH_SUBJECT_CLAIM:-sub}
      AUTHZ_OAUTH_USERNAME_CLAIM: ${AUTHZ_OAUTH_USERNAME_CLAIM:-email}
      AUTHZ_OAUTH_ROLE_CLAIM: ${AUTHZ_OAUTH_ROLE_CLAIM:-roles}
      AUTHZ_OAUTH_ROLE_MAP: ${AUTHZ_OAUTH_ROLE_MAP:-}
      AUTHZ_OAUTH_DEFAULT_ROLES: ${AUTHZ_OAUTH_DEFAULT_ROLES:-viewer}
      AUTHZ_OAUTH_REQUIRE_VERIFIED_EMAIL: ${AUTHZ_OAUTH_REQUIRE_VERIFIED_EMAIL:-false}
      AUTHZ_OAUTH_STATE_TTL: ${AUTHZ_OAUTH_STATE_TTL:-600}
      AUTHZ_OAUTH_CONNECT_TIMEOUT_MS: ${AUTHZ_OAUTH_CONNECT_TIMEOUT_MS:-10000}
      AUTHZ_OAUTH_SEND_TIMEOUT_MS: ${AUTHZ_OAUTH_SEND_TIMEOUT_MS:-10000}
      AUTHZ_OAUTH_READ_TIMEOUT_MS: ${AUTHZ_OAUTH_READ_TIMEOUT_MS:-15000}
      AUTHZ_DNS_RESOLVER: ${AUTHZ_DNS_RESOLVER:-}
      OPENRESTY_TEMPLATE_DIR: /etc/openresty/templates
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${ADMIN_UI_DIR:-./admin}:/usr/local/openresty/nginx/html/admin:ro
      - ${LUALIB_DIR:-./lualib}:/usr/local/openresty/site/lualib:ro
      - ${NGINX_TEMPLATE_DIR:-./conf}:/etc/openresty/templates:ro
