# ============================================================
# http_inc.conf — 用户自定义 http{} 层附加配置
#
# 本文件由入口脚本在缺失时自动生成。它会被 include 到
# nginx.conf 的 http{} 块末尾，可在此添加额外的：
#   - server { ... }         自定义站点/端口
#   - upstream { ... }       后端池
#   - map / lua_shared_dict  等 http 级指令
#
# 修改后重建或重启容器生效（conf/ 目录挂载到
# /etc/openresty/templates）。语法错误会导致 nginx 无法启动，
# 可先执行: docker exec <容器> openresty -t 验证。
# ============================================================

